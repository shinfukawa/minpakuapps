<script type="text/babel">
const {useState,useCallback,useRef,useEffect,useMemo}=React;
 
// ═══════════════════════════════════════════
// GitHubの設定（あなたのリポジトリ情報）
// ═══════════════════════════════════════════
const GITHUB_USER = 'shinfukawa';
const GITHUB_REPO = 'minpakuapps';
const DATA_FILE   = 'data.json';
const RAW_URL = `https://raw.githubusercontent.com/${GITHUB_USER}/${GITHUB_REPO}/main/${DATA_FILE}`;
 
// ═══════════════════════════════════════════

  {id:"2025-05",year:2025,month:5,label:"2025年5月",nights:10,sales:332290,roomRevenue:284290,cleaning:48000,avgRate:28429,otaFee:46951,receive:285339,tax:0,source:"excel"},
  {id:"2025-06",year:2025,month:6,label:"2025年6月",nights:11,sales:284460,roomRevenue:268460,cleaning:16000,avgRate:24405,otaFee:40677,receive:243783,tax:0,source:"excel"},
  {id:"2025-07",year:2025,month:7,label:"2025年7月",nights:22,sales:611594,roomRevenue:571594,cleaning:40000,avgRate:25982,otaFee:89959,receive:521635,tax:0,source:"excel"},
  {id:"2025-08",year:2025,month:8,label:"2025年8月",nights:15,sales:621900,roomRevenue:581900,cleaning:40000,avgRate:38793,otaFee:90514,receive:531386,tax:0,source:"excel"},
  {id:"2025-09",year:2025,month:9,label:"2025年9月",nights:17,sales:423070,roomRevenue:399570,cleaning:23500,avgRate:23504,otaFee:62806,receive:360264,tax:0,source:"excel"},
  {id:"2025-10",year:2025,month:10,label:"2025年10月",nights:31,sales:799075,roomRevenue:781575,cleaning:17500,avgRate:25212,otaFee:115516,receive:683559,tax:0,source:"excel"},
  {id:"2025-11",year:2025,month:11,label:"2025年11月",nights:20,sales:389900,roomRevenue:386400,cleaning:3500,avgRate:19320,otaFee:58485,receive:331415,tax:0,source:"excel"},
  {id:"2025-12",year:2025,month:12,label:"2025年12月",nights:23,sales:559020,roomRevenue:532020,cleaning:27000,avgRate:23131,otaFee:84557,receive:474463,tax:0,source:"excel"},
  {id:"2026-01",year:2026,month:1,label:"2026年1月",nights:11,sales:254793,roomRevenue:236793,cleaning:18000,avgRate:21527,otaFee:39493,receive:215300,tax:0,source:"excel"},
  {id:"2026-02",year:2026,month:2,label:"2026年2月",nights:24,sales:661570,roomRevenue:629570,cleaning:32000,avgRate:26232,otaFee:87530,receive:574040,tax:0,source:"excel"},
  {id:"2026-03",year:2026,month:3,label:"2026年3月",nights:10,sales:251810,roomRevenue:231810,cleaning:20000,avgRate:23181,otaFee:45656,receive:206154,tax:0,source:"excel"},
];
 
/* ── ユーティリティ ── */
const fmt=n=>n==null?"-":Math.round(n).toLocaleString("ja-JP");
const fy=n=>"¥"+Math.round(n||0).toLocaleString("ja-JP");
const isValid=d=>d&&d.year>0&&d.month>=1&&d.month<=12&&d.label&&d.label!=='不明';
function taxPP(r){const b=Math.floor(r/1000)*1000;return Math.min(b*0.02,2000);}
function sortArr(arr){return[...arr].sort((a,b)=>a.year!==b.year?a.year-b.year:a.month-b.month);}
function mkId(y,m){return`${y}-${String(m).padStart(2,'0')}`;}
function mkLabel(y,m){return`${y}年${m}月`;}
function monthLabel(d){
  if(!d)return'不明';
  const dt=new Date(d.replace(/\//g,'-'));
  return isNaN(dt)?d.slice(0,7):`${dt.getFullYear()}年${dt.getMonth()+1}月`;
}
 
/* ── データマージ ── */
function mergeData(historical, csvRecords){
  const map={};
  for(const h of historical.filter(isValid)) map[h.id]=h;
  for(const r of csvRecords.filter(isValid)) map[r.id]=r;
  return Object.values(map);
}
 
/* ── CSV解析 ── */
function parseCSV(text){
  const lines=text.trim().split(/\r?\n/);
  const hdrs=lines[0].split(',').map(h=>h.replace(/^"|"$/g,'').trim());
  return lines.slice(1).map(line=>{
    const cols=[];let inQ=false,cur='';
    for(const c of line){if(c==='"'){inQ=!inQ;}else if(c===','&&!inQ){cols.push(cur.trim());cur='';}else cur+=c;}
    cols.push(cur.trim());
    const obj={};hdrs.forEach((h,i)=>obj[h]=cols[i]??'');return obj;
  }).filter(r=>Object.values(r).some(v=>v));
}
 
function readCSV(text){
  const rows=parseCSV(text).filter(r=>!r['状態']?.includes('キャンセル')&&r['チェックイン']?.trim());
  if(!rows.length)throw new Error('有効な予約データが見つかりませんでした');
  const byM={};
  for(const r of rows){
    const d=new Date(r['チェックイン'].replace(/\//g,'-'));
    if(isNaN(d))continue;
    const y=d.getFullYear(),m=d.getMonth()+1,id=mkId(y,m);
    if(!byM[id])byM[id]={y,m,id,label:mkLabel(y,m),bks:[]};
    const nights=parseInt(r['合計日数'])||1,guests=parseInt(r['ゲスト数'])||1;
    const sales=parseFloat(r['販売'])||0,cleaning=parseFloat(r['クリーニング代'])||0;
    const rm=sales-cleaning;
    byM[id].bks.push({nights,guests,sales,cleaning,rm,
      otaFee:parseFloat(r['OTAサービス料'])||0,
      receive:parseFloat(r['受取金'])||0,
      tax:taxPP(rm/nights/guests)*guests*nights});
  }
  return Object.values(byM).map(({y,m,id,label,bks})=>{
    const s=k=>bks.reduce((a,b)=>a+(b[k]||0),0);
    const n=s('nights'),rm=s('rm');
    return{id,year:y,month:m,label,nights:n,sales:Math.round(s('sales')),
      roomRevenue:Math.round(rm),cleaning:Math.round(s('cleaning')),
      avgRate:n>0?Math.round(rm/n):0,otaFee:Math.round(s('otaFee')),
      receive:Math.round(s('receive')),tax:Math.round(s('tax')),source:'csv'};
  });
}
 
/* ── Chart ── */
function CBox({title,type,labels,datasets,yfmt}){
  const ref=useRef(null),inst=useRef(null);
  useEffect(()=>{
    if(!ref.current)return;
    if(inst.current)inst.current.destroy();
    inst.current=new Chart(ref.current,{type,data:{labels,datasets},options:{
      responsive:true,maintainAspectRatio:false,
      plugins:{legend:{position:'bottom',labels:{font:{size:10},boxWidth:11,padding:8}}},
      scales:{
        x:{ticks:{font:{size:10},maxRotation:50}},
        y:{ticks:{font:{size:10},callback:v=>yfmt?yfmt(v):v.toLocaleString()},beginAtZero:true},
      },
    }});
    return()=>{if(inst.current)inst.current.destroy();};
  },[labels,datasets,type]);
  return(<div className="cbox"><div className="ctit2">{title}</div><div className="cwrap"><canvas ref={ref}/></div></div>);
}
 
/* ── Excel出力 ── */
function doExport(sorted){
  const wb=XLSX.utils.book_new();
  const h1=['年月','泊数','売上','宿泊料','清掃料','1泊単価','OTA手数料','入金予定額','宿泊税','県税(0.8%)','北谷町税(1.2%)','種別'];
  const ws1=XLSX.utils.aoa_to_sheet([h1,...sorted.map(d=>[d.label,d.nights,d.sales,d.roomRevenue,d.cleaning,d.avgRate,d.otaFee,d.receive,d.tax,Math.round(d.tax*.4),Math.round(d.tax*.6),d.source==='csv'?'CSV':'Excel'])]);
  ws1['!cols']=[12,6,10,10,8,9,10,11,9,9,12,8].map(w=>({wch:w}));
  XLSX.utils.book_append_sheet(wb,ws1,'月別サマリー');
  const csv=sorted.filter(d=>d.source==='csv');
  if(csv.length){
    const h2=['年月','泊数','宿泊税合計','県税(0.8%)','北谷町税(1.2%)'];
    const tot=csv.reduce((s,d)=>s+d.tax,0);
    const ws2=XLSX.utils.aoa_to_sheet([h2,...csv.map(d=>[d.label,d.nights,d.tax,Math.round(d.tax*.4),Math.round(d.tax*.6)]),['合計',csv.reduce((s,d)=>s+d.nights,0),Math.round(tot),Math.round(tot*.4),Math.round(tot*.6)]]);
    ws2['!cols']=[12,8,12,12,14].map(w=>({wch:w}));
    XLSX.utils.book_append_sheet(wb,ws2,'宿泊税申告');
  }
  XLSX.writeFile(wb,`コーラルハウス_${new Date().toISOString().slice(0,10)}.xlsx`);
}
 
/* ── data.json ダウンロード ── */
function downloadDataJson(csvRecords){
  const json=JSON.stringify(csvRecords,null,2);
  const blob=new Blob([json],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url; a.download='data.json'; a.click();
  URL.revokeObjectURL(url);
}
 
/* ══════════════════════════════════════════
   メインアプリ
══════════════════════════════════════════ */
function App(){
  const [csvRecords,setCsvRecords]=useState([]);   // GitHubから取得したCSVデータ
  const [loading,setLoading]=useState(true);        // 初期ロード中
  const [synced,setSynced]=useState(false);         // GitHub同期済み
  const [tab,setTab]=useState('data');
  const [err,setErr]=useState('');
  const [msg,setMsg]=useState('');
  const [pendingJson,setPendingJson]=useState(null); // 未アップロードのデータ
  const csvRef=useRef();
 
  /* GitHub から data.json を取得 */
  useEffect(()=>{
    setLoading(true);
    fetch(RAW_URL+'?t='+Date.now())
      .then(r=>{
        if(!r.ok) throw new Error('not found');
        return r.json();
      })
      .then(data=>{
        const valid=Array.isArray(data)?data.filter(isValid):[];
        setCsvRecords(valid);
        setSynced(true);
        setLoading(false);
      })
      .catch(()=>{
        // data.json がまだない場合は空で開始
        setCsvRecords([]);
        setSynced(false);
        setLoading(false);
      });
  },[]);
 
  const flash=m=>{setMsg(m);setTimeout(()=>setMsg(''),6000);};
 
  /* CSV読み込み */
  const handleCSV=useCallback(file=>{
    if(!file)return; setErr('');
    const r=new FileReader();
    r.onload=e=>{try{
      const newMonths=readCSV(e.target.result);
      // 既存CSVレコードとマージ
      const map={};
      for(const d of csvRecords) map[d.id]=d;
      for(const m of newMonths) map[m.id]=m;
      const merged=Object.values(map).filter(isValid);
      setCsvRecords(merged);
      setPendingJson(merged); // アップロード待ち状態に
      flash(`✅ ${newMonths.map(m=>m.label).join('・')}のデータを追加しました。下の「data.jsonをダウンロード」→GitHubにアップロードで全デバイスに反映されます`);
    }catch(ex){setErr(ex.message);}};
    r.readAsText(file,'UTF-8');
  },[csvRecords]);
 
  /* data.json をダウンロードして GitHub へのアップロードを促す */
  const handleDownloadJson=()=>{
    downloadDataJson(csvRecords);
    setPendingJson(null);
  };
 
  /* 表示データ = 過去データ + CSVデータのマージ */
  const sorted=useMemo(()=>sortArr(mergeData(HISTORICAL,csvRecords)),[csvRecords]);
  const csvData=sorted.filter(d=>d.source==='csv');
  const sum=k=>sorted.reduce((s,d)=>s+(d[k]||0),0);
  const totalTax=csvData.reduce((s,d)=>s+d.tax,0);
 
  /* グラフ */
  const labels=sorted.map(d=>`${d.year}/${d.month}月`);
  const C={b1:'rgba(0,119,182,0.82)',b2:'rgba(0,180,216,0.7)',line:'#f59e0b',tax:'rgba(220,38,38,0.75)',taxNo:'rgba(200,200,200,0.3)'};
 
  return(
    <div className="wrap">
      {/* ヘッダー */}
      <div className="hero">
        <div>
          <h1>🌊 コーラルハウス北谷　売上・宿泊税管理</h1>
          <p>毎月のCSV取込 → data.jsonをGitHubにアップロード → 全デバイスで自動同期</p>
        </div>
        <div className="pills">
          <span className="pill">宿泊税 2.0%</span>
          <span className="pill">県税 0.8% ＋ 北谷町税 1.2%</span>
        </div>
      </div>
 
      {/* タブ */}
      <div className="tabs">
        {[['data','📂 データ管理'],['chart','📈 グラフ'],['tax','🧾 宿泊税申告']].map(([k,l])=>(
          <div key={k} className={'tab'+(tab===k?' active':'')} onClick={()=>setTab(k)}>{l}</div>
        ))}
      </div>
 
      {/* ── データ管理 ── */}
      {tab==='data'&&<>
 
        {/* GitHub同期状態 */}
        <div className="card">
          <div className="ctitle">🔄 GitHub データ同期状態</div>
          {loading&&<div className="loading"><div className="spinner"></div>GitHubからデータを取得中...</div>}
          {!loading&&synced&&<div className="ok">✅ GitHubの data.json から最新データを取得しました（{csvData.length}ヶ月分のCSVデータ）</div>}
          {!loading&&!synced&&<div className="warn">⚠️ GitHubにまだdata.jsonがありません。CSVを取り込んでdata.jsonをアップロードしてください</div>}
 
          {/* アップロード待ちのdata.jsonがある場合 */}
          {pendingJson&&(
            <div className="sync-box">
              <div className="sync-title">📤 data.json を GitHub にアップロードしてください</div>
              <div className="sync-steps">
                <div className="sync-step"><div className="sync-num">1</div><div>下の「📥 data.json をダウンロード」ボタンを押す</div></div>
                <div className="sync-step"><div className="sync-num">2</div><div>GitHub の <strong>shinfukawa/minpakuapps</strong> リポジトリを開く</div></div>
                <div className="sync-step"><div className="sync-num">3</div><div>「Add file」→「Upload files」→ダウンロードした data.json をアップロード</div></div>
                <div className="sync-step"><div className="sync-num">4</div><div>「Commit changes」→ 数分後に全デバイスで新データが反映されます ✅</div></div>
              </div>
              <div className="btns">
                <button className="btn btn-amber" onClick={handleDownloadJson}>📥 data.json をダウンロード</button>
              </div>
            </div>
          )}
        </div>
 
        {/* CSVアップロード */}
        <div className="card">
          <div className="ctitle">📥 毎月のCSV取込</div>
          <div
            className={"ubox"+(false?' over':'')}
            onDragOver={e=>{e.preventDefault();e.currentTarget.classList.add('over');}}
            onDragLeave={e=>e.currentTarget.classList.remove('over')}
            onDrop={e=>{e.preventDefault();e.currentTarget.classList.remove('over');handleCSV(e.dataTransfer.files[0]);}}
            onClick={()=>csvRef.current.click()}>
            <div className="ico">📄</div>
            <div className="lbl">Booking_...csv をここにドラッグ＆ドロップ</div>
            <div className="sub">AirhostOneから毎月ダウンロードしたCSVを取込<br/>取込後、data.jsonをGitHubにアップロードで全デバイスに反映</div>
          </div>
          <input ref={csvRef} type="file" accept=".csv" style={{display:'none'}} onChange={e=>handleCSV(e.target.files[0])}/>
          {err&&<div className="err">⚠️ {err}</div>}
          {msg&&<div className="ok" style={{marginTop:8}}>{msg}</div>}
        </div>
 
        {/* サマリー */}
        {sorted.length>0&&<>
          <div className="card">
            <div className="ctitle">📊 累計サマリー（{sorted.length}ヶ月分）</div>
            <div className="sgrid">
              <div className="sc"><div className="sc-l">取込月数</div><div className="sc-v">{sorted.length}<span style={{fontSize:12}}>ヶ月</span></div><div className="sc-s">内蔵 {HISTORICAL.length}ヶ月 ＋ CSV {csvData.length}ヶ月</div></div>
              <div className="sc"><div className="sc-l">総泊数</div><div className="sc-v">{fmt(sum('nights'))}<span style={{fontSize:12}}>泊</span></div></div>
              <div className="sc"><div className="sc-l">総売上</div><div className="sc-v" style={{fontSize:16}}>{fy(sum('sales'))}</div></div>
              <div className="sc"><div className="sc-l">総入金予定額</div><div className="sc-v" style={{fontSize:16}}>{fy(sum('receive'))}</div></div>
              <div className="sc"><div className="sc-l">宿泊税合計</div><div className="sc-v" style={{color:'#dc2626',fontSize:16}}>{fy(totalTax)}</div><div className="sc-s">CSV取込月分</div></div>
              <div className="sc"><div className="sc-l">1泊平均単価</div><div className="sc-v" style={{fontSize:15}}>{fy(sum('nights')>0?sorted.reduce((s,d)=>s+d.roomRevenue,0)/sum('nights'):0)}</div></div>
            </div>
          </div>
 
          {/* テーブル */}
          <div className="card">
            <div className="ctitle">📋 月別データ一覧</div>
            <div className="tw">
              <table>
                <thead><tr>
                  <th>年月</th><th>泊数</th><th>売上</th><th>宿泊料</th><th>清掃料</th>
                  <th>1泊単価</th><th>OTA手数料</th><th>入金予定額</th>
                  <th style={{background:'#dbeafe',color:'#1e40af'}}>宿泊税</th>
                  <th style={{background:'#dbeafe',color:'#1e40af'}}>県税</th>
                  <th style={{background:'#dbeafe',color:'#1e40af'}}>北谷町税</th>
                  <th>種別</th>
                </tr></thead>
                <tbody>
                  {sorted.map(d=>(
                    <tr key={d.id}>
                      <td className="c" style={{fontWeight:600}}>{d.label}</td>
                      <td className="c">{d.nights}泊</td>
                      <td className="r">{fmt(d.sales)}</td>
                      <td className="r">{fmt(d.roomRevenue)}</td>
                      <td className="r">{fmt(d.cleaning)}</td>
                      <td className="r">{fmt(d.avgRate)}</td>
                      <td className="r">{fmt(d.otaFee)}</td>
                      <td className="r">{fmt(d.receive)}</td>
                      <td className="r tv">{d.tax>0?fmt(d.tax):'-'}</td>
                      <td className="r" style={{color:'#64748b'}}>{d.tax>0?fmt(d.tax*.4):'-'}</td>
                      <td className="r" style={{color:'#64748b'}}>{d.tax>0?fmt(d.tax*.6):'-'}</td>
                      <td className="c">{d.source==='csv'?<span className="bcsv">CSV</span>:<span className="bxl">内蔵</span>}</td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
            <div className="btns">
              <button className="btn btn-g" onClick={()=>doExport(sorted)}>📥 Excelダウンロード</button>
              {csvData.length>0&&<button className="btn btn-amber" onClick={handleDownloadJson}>📤 data.json をダウンロード（GitHub用）</button>}
            </div>
            <div className="note-blue">
              💡 <strong>毎月の手順：</strong>①CSVをアップロード → ②「data.jsonをダウンロード」→ ③GitHubのリポジトリに data.json をアップロード → ④全デバイスに自動反映（数分後）
            </div>
          </div>
        </>}
      </>}
 
      {/* ── グラフ ── */}
      {tab==='chart'&&(sorted.length===0
        ?<div className="card"><div className="empty">データがありません</div></div>
        :<>
          <div className="cgrid">
            <CBox title="📦 月別売上推移（円）" type="bar" labels={labels}
              yfmt={v=>v>=10000?Math.round(v/10000)+'万':v.toLocaleString()}
              datasets={[
                {label:'宿泊料',data:sorted.map(d=>d.roomRevenue),backgroundColor:C.b1,borderRadius:3,stack:'s'},
                {label:'清掃料',data:sorted.map(d=>d.cleaning),backgroundColor:C.b2,borderRadius:3,stack:'s'},
              ]}/>
            <CBox title="🛏 月別泊数推移（泊）" type="bar" labels={labels}
              datasets={[{label:'泊数',data:sorted.map(d=>d.nights),backgroundColor:C.b1,borderRadius:3}]}/>
            <CBox title="💰 1泊平均単価推移（円）" type="line" labels={labels}
              yfmt={v=>v.toLocaleString()+'円'}
              datasets={[{label:'1泊単価',data:sorted.map(d=>d.avgRate),borderColor:C.line,backgroundColor:'rgba(245,158,11,0.12)',fill:true,tension:0.35,pointRadius:4,pointBackgroundColor:C.line}]}/>
            <CBox title="🏛 宿泊税推移（円）※CSV取込月のみ" type="bar" labels={labels}
              datasets={[{label:'宿泊税',data:sorted.map(d=>d.tax||0),backgroundColor:sorted.map(d=>d.tax>0?C.tax:C.taxNo),borderRadius:3}]}/>
          </div>
          <div className="note">📌 宿泊税はBooking CSV取込月のみ集計されます（内蔵の過去データは0）。毎月CSVを追加するとグラフが更新されます。</div>
        </>
      )}
 
      {/* ── 宿泊税申告 ── */}
      {tab==='tax'&&(csvData.length===0
        ?<div className="card"><div className="empty">Booking CSVから取り込んだデータがありません。<br/>「データ管理」タブからCSVを追加してください</div></div>
        :<div className="card">
          <div className="ctitle">🧾 宿泊税申告サマリー（CSV取込月のみ）</div>
          <div className="sgrid">
            <div className="sc"><div className="sc-l">申告対象月</div><div className="sc-v">{csvData.length}<span style={{fontSize:12}}>ヶ月</span></div></div>
            <div className="sc"><div className="sc-l">宿泊税合計</div><div className="sc-v" style={{color:'#dc2626',fontSize:16}}>{fy(totalTax)}</div></div>
            <div className="sc"><div className="sc-l">県税（0.8%）</div><div className="sc-v" style={{fontSize:16}}>{fy(totalTax*.4)}</div></div>
            <div className="sc"><div className="sc-l">北谷町税（1.2%）</div><div className="sc-v" style={{fontSize:16}}>{fy(totalTax*.6)}</div></div>
          </div>
          <div className="tw">
            <table>
              <thead><tr><th>年月</th><th>泊数</th><th>宿泊税合計</th><th>県税(0.8%)</th><th>北谷町税(1.2%)</th></tr></thead>
              <tbody>
                {csvData.map(d=>(
                  <tr key={d.id}>
                    <td className="c" style={{fontWeight:600}}>{d.label}</td>
                    <td className="c">{d.nights}泊</td>
                    <td className="r tv">{fy(d.tax)}</td>
                    <td className="r">{fy(d.tax*.4)}</td>
                    <td className="r">{fy(d.tax*.6)}</td>
                  </tr>
                ))}
                <tr style={{background:'#f1f5f9',fontWeight:700}}>
                  <td className="c">合　計</td>
                  <td className="c">{csvData.reduce((s,d)=>s+d.nights,0)}泊</td>
                  <td className="r tv">{fy(totalTax)}</td>
                  <td className="r">{fy(totalTax*.4)}</td>
                  <td className="r">{fy(totalTax*.6)}</td>
                </tr>
              </tbody>
            </table>
          </div>
          <div className="btns">
            <button className="btn btn-g" onClick={()=>doExport(sorted)}>📥 申告用Excelダウンロード</button>
          </div>
          <div className="note">
            ⚠️ <strong>計算方法：</strong>(売上−清掃料)÷泊数÷人数で1人1泊料金を算出し、1,000円未満切捨て後に2%（上限¥2,000/人/泊）。<br/>
            <strong>申告期限：</strong>原則として翌月末までに沖縄県（県税）および北谷町（町税）へ申告・納付。申告前に税務担当者にご確認ください。
          </div>
        </div>
      )}
    </div>
  );
}
 
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
